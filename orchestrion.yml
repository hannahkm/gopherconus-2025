---
# yaml-language-server: $schema=https://datadoghq.dev/orchestrion/schema.json
meta:
  name: otel-orchestrion
  description: Enables running the OTel SDK under the hood with Orchestrion

aspects:
  # Initialize OTel tracer in init function
  - id: init OTel tracer
    join-point:
      all-of:
        - package-name: main
        - function-body:
            function:
              - name: main
              - signature: {}
    advice:
      - inject-declarations:
          imports:
            handlers: github.com/hannahkm/gopherconus-2025/handlers
            context: context
          template: |-
            var otelShutdown func(context.Context) error
            
            func init() {
              serviceName := handlers.GetServiceName()
              otelShutdown = handlers.SetupTraceProvider(serviceName)
            }
      
      # Add defer to main function to shutdown tracer
      - prepend-statements:
          imports:
            context: context
            log: log
          template: |-
            defer func() {
              if otelShutdown != nil {
                if err := otelShutdown(context.Background()); err != nil {
                  log.Printf("Error shutting down OTel provider: %v", err)
                }
              }
            }()

  # Modify DefaultInstrumentation to use OTel HTTP instrumentation
  - id: Create OTel handlers
    join-point:
      function-body: 
        function:
          - name: DefaultInstrumentation
    advice:
      prepend-statements:
        imports:
          otelhttp: go.opentelemetry.io/contrib/instrumentation/net/http/otelhttp
          http: net/http
          handlers: github.com/hannahkm/gopherconus-2025/handlers
        template: |-
          {{ $ret := .Function.ResultThatImplements "net/http.Handler" }}
          {{ with $ret }}
            mux := http.NewServeMux()
            handleFunc := func(pattern string, handlerFunc func(http.ResponseWriter, *http.Request)) {
              // Configure the "http.route" for the HTTP instrumentation.
              handler := otelhttp.WithRouteTag(pattern, http.HandlerFunc(handlerFunc))
              mux.Handle(pattern, handler)
            }
            handleFunc("/hello", func(w http.ResponseWriter, r *http.Request) {
              handlers.ManualHandler(w, r)
            })

            {{ $ret }} = otelhttp.NewHandler(mux, "/")
            return {{ $ret }}
          {{- end -}}

  - id: Setup OTel Database
    join-point:
      function-body: 
        function:
          - name: SetupDB
    advice:
      prepend-statements:
        imports:
          db_handlers: github.com/hannahkm/gopherconus-2025/db_handling
        template: |-
          var err error
          db, err = db_handlers.Manual_InitDB()
          return err