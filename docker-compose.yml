services:
  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=gopherconus
      - DOCKER_INFLUXDB_INIT_ORG=gopherconus
      - DOCKER_INFLUXDB_INIT_BUCKET=k6testing
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=13NSkxbvAnGSbQIHAzWAQFsNVDXWHD94-NG2taWgmFCJ1FiLiFjjwNe_Vg37sKUc2Cn_kSWYMCR0egexhp3PRg==

  grafana:
    image: grafana/grafana:10.3.3
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning

  go-auto:
    image: otel/autoinstrumentation-go
    privileged: true
    pid: "host"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_GO_AUTO_TARGET_EXE=/usr/local/bin/
      - OTEL_SERVICE_NAME="ebpf-auto-instrumentation"
      - OTEL_PROPAGATORS=tracecontext,baggage
      - OTEL_GO_AUTO_GLOBAL=true
      - OTEL_GO_AUTO_INCLUDE_DB_STATEMENT=true
      - OTEL_GO_AUTO_PARSE_DB_STATEMENT=true
    volumes:
      - /proc:/host/proc
    depends_on:
      - otel-collector
    profiles:
      - ebpf-auto-instrumentation
      
  k6-load-test:
    image: grafana/k6:latest
    stdin_open: true
    environment:
      - BASE_URL=${BASE_URL:-http://host.docker.internal:8080}
      - INSTRUMENTATION=${INSTRUMENTATION:-default}
      - K6_INFLUXDB_ORGANIZATION=gopherconus
      - K6_INFLUXDB_BUCKET=k6testing
      - K6_INFLUXDB_TOKEN=13NSkxbvAnGSbQIHAzWAQFsNVDXWHD94-NG2taWgmFCJ1FiLiFjjwNe_Vg37sKUc2Cn_kSWYMCR0egexhp3PRg==
      - K6_INFLUXDB_ADDR=http://host.docker.internal:8086/k6testing
    volumes:
      - .:/k6 
    profiles:
      - load-test

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: instrumentation_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  otel-collector:
    image: otel/opentelemetry-collector-contrib
    command: --config /otel-local-config.yaml
    volumes:
      - ./otel-collector-config.yaml:/otel-local-config.yaml
    ports:    
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
    environment:
      - DD_API_KEY=${DD_API_KEY}
    profiles:
      - with-instrumentation
    depends_on:
      - influxdb

volumes:
  postgres_data: